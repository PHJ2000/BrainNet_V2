server.port=${PORT:8080}
spring.application.name=brainnet-spring-vertical-slice
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brainshare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brain}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pass}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:3000}
spring.threads.virtual.enabled=true
spring.sql.init.mode=never
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

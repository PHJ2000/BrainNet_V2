server.port=8080
spring.application.name=brainnet-vertical-slice
spring.threads.virtual.enabled=true
spring.datasource.url=${JDBC_URL:jdbc:postgresql://postgres:5432/vertical}
spring.datasource.username=${DB_USER:benchmark}
spring.datasource.password=${DB_PASSWORD:benchmark}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
server.tomcat.threads.max=200
spring.main.keep-alive=true
logging.level.root=WARN

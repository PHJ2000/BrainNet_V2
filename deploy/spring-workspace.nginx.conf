log_format safe '$request_method $uri $status';
access_log /dev/stdout safe;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8000;
    client_max_body_size 10m;
    location ~ ^/projects/[0-9]+/ws/?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location ~ ^/(auth|users|projects|workspace|health|metrics)(/|$) {
        proxy_pass http://spring:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
        add_header X-BrainNet-Writer spring always;
    }
    location / { proxy_pass http://frontend:3000; proxy_set_header Host $http_host; }
}

# Isolated integration stack. Never mount a personal database volume here.
name: brainnet-spring-workspace-qa
services:
  db:
    image: postgres:15-alpine
    environment: {POSTGRES_DB: workspace_qa, POSTGRES_USER: workspace_qa, POSTGRES_PASSWORD: workspace_qa_only}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U workspace_qa -d workspace_qa"], interval: 2s, timeout: 3s, retries: 30}
    volumes: [qa-db:/var/lib/postgresql/data]
  provider:
    build: {context: .., dockerfile: backend/Dockerfile}
    entrypoint: [python, /workspace/experiments/runtime-nodes/mock_provider.py]
    volumes: ["..:/workspace:ro"]
  mailpit:
    image: axllent/mailpit:v1.20
  spring:
    build: {context: .., dockerfile: spring/vertical-slice/Dockerfile}
    environment:
      JWT_SECRET: spring-workspace-isolated-verification-key-32
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workspace_qa
      SPRING_DATASOURCE_USERNAME: workspace_qa
      SPRING_DATASOURCE_PASSWORD: workspace_qa_only
      OPENAI_API_KEY: local-provider-only
      OPENAI_API_URL: http://provider:8090/v1/chat/completions
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: [CMD, curl, -fsS, http://localhost:8080/health], interval: 3s, timeout: 5s, retries: 60}
  backend:
    build: {context: .., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+asyncpg://workspace_qa:workspace_qa_only@db:5432/workspace_qa
      JWT_SECRET: spring-workspace-isolated-verification-key-32
      NODE_EVENTS_ENABLED: "true"
    volumes: ["..:/workspace:ro"]
    depends_on: {spring: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 3s, timeout: 5s, retries: 30}
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.local
      args: {NEXT_PUBLIC_API_BASE_URL: "http://localhost:18180"}
    environment: {NEXT_TELEMETRY_DISABLED: "1"}
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 3s, timeout: 5s, retries: 30}
  proxy:
    image: nginx:1.28-alpine
    volumes: ["./spring-workspace.nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:18180:8000"]
    depends_on: {spring: {condition: service_healthy}, backend: {condition: service_healthy}, frontend: {condition: service_healthy}}
volumes:
  qa-db:

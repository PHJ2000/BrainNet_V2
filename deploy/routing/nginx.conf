events { worker_connections 2048; }
http {
    # Deliberately omit query strings: the existing websocket auth uses a token query.
    log_format safe '$request_method $uri $status $request_time $upstream_response_time';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream fastapi { server fastapi:8000; server fastapi-secondary:8000; keepalive 32; }
    upstream spring { server spring:8080; keepalive 32; }
    map "$request_method:$uri" $node_owner {
        default fastapi;
        include /etc/nginx/brainnet/canary.map;
    }
    server {
        listen 8080;
        location ~ ^/(projects|auth|users|health)(/|$) {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_next_upstream off;
            add_header X-BrainNet-Writer $node_owner always;
            proxy_pass http://$node_owner$request_uri;
        }
        location / {
            proxy_set_header Host $host;
            proxy_pass http://frontend:3000;
        }
    }
}

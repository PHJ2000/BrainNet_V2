name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  spring:
    name: Spring business contracts and legacy database adoption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: spring/vertical-slice/pom.xml
      - run: mvn -B -f spring/vertical-slice/pom.xml test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spring-test-results
          path: spring/vertical-slice/target/surefire-reports
  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm test && npm run build
  relay:
    name: WebSocket relay boundary and authorization
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
      JWT_SECRET: brainnet-ci-websocket-test-secret-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q backend/tests/test_websocket_contract.py backend/tests/test_relay_boundary.py
  browser:
    name: Spring-only workspace browser and WebSocket integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker compose -f deploy/spring-workspace.compose.yml up --build -d --wait --wait-timeout 240
      - name: Browser journeys against Spring
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:18180
        run: npx playwright test --reporter=line
      - name: Real relay delivery, revocation, and process boundary
        run: docker compose -f deploy/spring-workspace.compose.yml exec -T backend python /workspace/deploy/verify-spring-relay.py
      - name: Save diagnostics
        if: failure()
        run: docker compose -f deploy/spring-workspace.compose.yml logs --no-color > /tmp/workspace-stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-results
          path: |
            frontend/test-results
            /tmp/workspace-stack.log
      - name: Stop isolated stack
        if: always()
        run: docker compose -f deploy/spring-workspace.compose.yml down -v

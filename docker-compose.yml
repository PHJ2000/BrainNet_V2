# docker-compose.yml (루트)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: brainshare
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brain -d brainshare"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://brain:pass@db:5432/brainshare
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REQUIRE_NODE_VERSION: ${REQUIRE_NODE_VERSION:-true}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
      NODE_EVENTS_ENABLED: ${NODE_EVENTS_ENABLED:-true}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}

    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ./backend/app:/app/app
    # command: poetry run uvicorn app.main:app --host 0.0.0.0 --reload
  spring:
    build: {context: ., dockerfile: spring/vertical-slice/Dockerfile}
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/brainshare
      SPRING_DATASOURCE_USERNAME: brain
      SPRING_DATASOURCE_PASSWORD: pass
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 3s
      timeout: 5s
      retries: 30
  proxy:
    image: nginx:1.28-alpine
    environment:
      BRAINNET_REST_UPSTREAM: ${BRAINNET_REST_UPSTREAM:-spring}
    volumes: ["./deploy/routing/rest-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro"]
    ports: ["8000:8000"]
    depends_on:
      backend: {condition: service_healthy}
      spring: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [proxy]
    ports: ["3000:3000"]
    volumes:
    - ./frontend:/app
    - /app/node_modules  # 중요: node_modules는 호스트와 충돌 방지용으로 제외
    environment:
      - CHOKIDAR_USEPOLLING=true  # Vite, Next 등 핫 리로드 문제 해결
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}

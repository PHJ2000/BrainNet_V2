# docker-compose.yml (루트)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: brainshare
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://brain:pass@db:5432/brainshare
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REQUIRE_NODE_VERSION: ${REQUIRE_NODE_VERSION:-true}
      SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
      NODE_EVENTS_ENABLED: ${NODE_EVENTS_ENABLED:-true}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-60}
      AUTH_MAX_INFLIGHT: ${AUTH_MAX_INFLIGHT:-32}
      AUTH_MAX_BODY_BYTES: ${AUTH_MAX_BODY_BYTES:-16384}
      WS_AUTH_CHECK_SECONDS: ${WS_AUTH_CHECK_SECONDS:-10}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-512}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}

    depends_on: [db]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/app/app
    # command: poetry run uvicorn app.main:app --host 0.0.0.0 --reload
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [backend]
    ports: ["3000:3000"]
    volumes:
    - ./frontend:/app
    - /app/node_modules  # 중요: node_modules는 호스트와 충돌 방지용으로 제외
    environment:
      - CHOKIDAR_USEPOLLING=true  # Vite, Next 등 핫 리로드 문제 해결
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}

volumes:
  db-data:
